# Inputs of worked_model.py: the recorded runs of the family's two sequential experiments, and the model's tunables.
# Every value under [model] is PROVISIONAL: nothing sets it, and the write-up shows what changes when it moves.

[model]
benefit_per_pass = 100000     # PROVISIONAL: tokens one passing run is worth (the rework it avoids); a judgment of the maintainer
future_runs = 200             # PROVISIONAL: delegated runs still to come, over which a better arm pays back
runs_per_step = 10            # one step is ten runs of one arm, as in both experiments
prior_mean = 0.25             # PROVISIONAL: pass rate assumed before any run
amplitude = 0.25              # PROVISIONAL: prior variance of the pass rate
length_tier = 1.0             # PROVISIONAL: kernel length along the model tier (small 0, Haiku 1)
length_info = 0.5             # PROVISIONAL: kernel length along the information level, scaled to 0..1
length_interface = 1.0        # PROVISIONAL: kernel length along the interface (API 0, coding agent 1)
ucb_beta = 2.0                # PROVISIONAL: width of the upper confidence bound, in standard deviations
thompson_draws = 4000         # draws of the Beta posteriors for the bandit policy
seed = 20261103
output_tokens_api = 930       # estimate: mean reply length of round one's 30 replies, characters divided by 4
agent_tokens_alone = 46900    # fresh input plus output tokens per agent session, mean of 15 (method comparison)
agent_tokens_method = 39650   # same, for the method arm

# Information level: 0 task sentence alone, 1 convention brief (what is decided), 2 convention plus the list of checks,
# 3 that plus a start file and a memory index (the method).
# Interface: 0 one call to the model's API, 1 a coding agent in a folder.
# prompt_tokens is the prompt length in characters divided by 4 (an estimate), averaged over the three tasks.
# k out of n runs passed the hidden tests. "stage" is the experiment that produced the run.

