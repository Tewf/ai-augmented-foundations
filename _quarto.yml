project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"
    - evidence/bayesian-optimisation/worked_model.py
    - evidence/bayesian-optimisation/worked-model.toml
    - evidence/bayesian-optimisation/test_worked_model.py
    - evidence/convergence/runs.toml
    - guide/replay.py
    - guide/trace.toml
    - guide/test_replay.py

website:
  title: "AI-augmented foundations"
  description: "Whether the family's setup is complete and whether it converges: what a tree or graph of topics can encode, a computed cost of a tree that no study has validated, and when a project stops at an acceptable result. Three principles, each with its grade."
  site-url: "https://tewf.github.io/ai-augmented-foundations/"
  repo-url: "https://github.com/Tewf/ai-augmented-foundations"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Principles
        href: standard.md
      - text: Evidence
        href: evidence/index.qmd
      - text: Decisions
        href: decisions/README.md
    right:
      - text: The family
        href: https://tewf.github.io/ai-augmented/
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
