# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The headings the standard's decision-record shape requires (reader-ergonomics v1.19.2, shapes/decision-record.md).
[shape_conformance]
shapes = [{ name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] }]

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics",
          "reader-ergonomics-topic",
          "reader-ergonomics-blueprint"]
shared_links = []

# The candidate cost of a tree of topics (checks/local/topic_cost.py, decision 0003). Nothing validates any value here.
[topic_cost]
depth_weight = 1.0      # PROVISIONAL: cost of each level of depth; no study sets it
nesting_weight = 1.0    # PROVISIONAL: extra cost of a break per level of depth; 1 is Cognitive Complexity's own
fan_free = 7            # PROVISIONAL: children a reader takes in without a break (Miller's seven, not tested for topics)
fan_weight = 1.0        # PROVISIONAL: cost of each child beyond fan_free
run_free = 60           # PROVISIONAL: words before the first list or table that cost nothing (the topic's summary bound)
run_step = 60           # PROVISIONAL: words of run beyond run_free that make one break
run_weight = 1.0        # PROVISIONAL: cost of one break of run
sentence_free = 35      # PROVISIONAL: words of the longest sentence that cost nothing (the family's writing rule)
sentence_step = 10      # PROVISIONAL: words of sentence beyond sentence_free that make one break
sentence_weight = 1.0   # PROVISIONAL: cost of one break of sentence
