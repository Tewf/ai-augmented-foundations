# The family's trace of two days (2026-11-02 and 2026-11-03), one row per job, read from the maintainer's log of two days
# and the notes each job left. It is the first dataset of the guide (design/guide.md, part one).
#
# wave:   the launch cluster of the job's brief, from the brief's file time. A wave is a decision point of the maintainer.
# kind:   setup, review, audit, design, build, experiment or upkeep (defined in design/guide.md).
# agents: how many agent runs the row holds (the brief says one repository per agent where it is more than one).
# tokens_k: thousands of tokens of ONE agent run on the subscription. "recorded" is in the log; "estimate" is 230, the
#         middle of the log's range for ten agents (137 to 326). PROVISIONAL: the log keeps no per-job count for most jobs.
# dollars: spend on a paid API outside the subscription, where the log records it; blank otherwise. Not in the replay's cost.
# moved:  1 if a later job or record names this job's output as the reason for a change (a grade, a design, a claim, a
#         rule) that stands at the end of the log. kept: 1 if the job's headline result stands at the end of the log.
#         Both are the reading of whoever wrote this file, not the maintainer's judgment. Blank: no outcome yet, or outside
#         the family; such a row counts for what was run, never for what was learned.
# in_family: false for work on another project; the replay leaves it out.

